<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>赤月猎场 · 美术预览</title>
<style>
  html, body { margin: 0; background: #2e2820; color: #e8dfc0;
    font-family: system-ui, "Microsoft YaHei", sans-serif; }
  #wrap { display: flex; flex-direction: column; align-items: center; padding: 14px 14px 40px; }
  h1 { font-size: 17px; margin: 4px 0 2px; letter-spacing: .5px; }
  p.sub { font-size: 12.5px; opacity: .65; margin: 0 0 12px; }
  #stage { width: 100%; max-width: 1280px; }
  canvas { display: block; width: 100%; height: auto; border-radius: 10px;
    box-shadow: 0 10px 34px rgba(0,0,0,.55); }
</style>
</head>
<body>
<div id="wrap">
  <h1>《赤月猎场》美术预览 · 青砖庭院 / 日漫 chibi / 国风怪物</h1>
  <p class="sub">与游戏共用同一套 renderer.js 绘制代码 —— 此处所见即游戏内所见</p>
  <div id="stage"><canvas id="game"></canvas></div>
</div>

<!-- 与 index.html 相同的依赖顺序（只加载渲染所需模块） -->
<script src="js/config.js"></script>
<script src="js/entities.js"></script>
<script src="js/weapons.js"></script>
<script src="js/renderer.js"></script>
<script>
(function () {
  'use strict';
  var Game = window.Game;
  var R = Game.Renderer;
  var canvas = document.getElementById('game');

  R.init(canvas);
  R.setQuality('high');

  /* 固定 1280x720 逻辑视口（预览用，不随窗口拉伸） */
  function fixView() {
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    R.view = { w: 1280, h: 720, scale: 1, dpr: dpr };
    canvas.width = 1280 * dpr;
    canvas.height = 720 * dpr;
    canvas.style.width = '100%';
    canvas.style.height = 'auto';
  }
  fixView();
  window.addEventListener('resize', fixView);

  /* 相机取世界中部，能带出庭院道具 */
  R.camera.x = 300; R.camera.y = 260;
  var CX = R.camera.x, CY = R.camera.y;

  /* ---------------- 构造预览内容 ---------------- */
  function mkPlayer(lx, ly, opts) {
    var p = new Game.Player('swordsman');
    p.x = CX + lx; p.y = CY + ly;
    p.facing = -Math.PI / 2;               // 朝上，正对观察者
    p.weapons = [new Game.WeaponInstance('iron_sword', 1)];
    for (var k in (opts || {})) p[k] = opts[k];
    return p;
  }

  var playerIdle = mkPlayer(150, 150, { moving: false });
  var playerWalk = mkPlayer(400, 150, { moving: true, walkTime: 0 });
  var playerHurt = mkPlayer(650, 150, { moving: false, hitFlashTimer: 0.2 });

  var enemies = [
    new Game.Enemy('zombie', CX + 150, CY + 400, 1),
    new Game.Enemy('bat',    CX + 400, CY + 400, 1),
    new Game.Enemy('wizard', CX + 650, CY + 400, 1),
    new Game.Enemy('boss',   CX + 950, CY + 400, 1),
  ];
  enemies[0].hp = enemies[0].maxHp * 0.55;   // 展示血条
  enemies[1].hp = enemies[1].maxHp * 0.35;
  enemies[2].hp = enemies[2].maxHp * 0.7;
  for (var i = 0; i < enemies.length; i++) enemies[i].facing = -Math.PI / 2;

  var projectiles = [
    new Game.Projectile({ x: CX + 150, y: CY + 620, vx: 100, vy: 0, radius: 6,
      damage: 5, fromPlayer: true, color: '#ffd76e', type: 'bullet' }),
    new Game.Projectile({ x: CX + 400, y: CY + 620, vx: 100, vy: 0, radius: 7,
      damage: 5, fromPlayer: false, color: '#c48aff', type: 'spell' }),
  ];
  projectiles[0].angle = 0;

  var pickups = [
    new Game.Pickup('xp', 3, CX + 650, CY + 620),
    new Game.Pickup('material', 2, CX + 900, CY + 620),
  ];

  var state = {
    player: playerIdle, enemies: enemies, projectiles: projectiles,
    pickups: pickups, elapsed: 0, screen: 'PLAYING',
  };

  /* ---------------- 标签 ---------------- */
  var LABELS = [
    { t: '主角 · 待机（呼吸）', x: CX + 150, y: CY + 218 },
    { t: '主角 · 行走（摆臂）', x: CX + 400, y: CY + 218 },
    { t: '主角 · 受击闪白', x: CX + 650, y: CY + 218 },
    { t: '跳尸（清朝官帽+符纸）', x: CX + 150, y: CY + 500 },
    { t: '蝠妖（翼膜+獠牙）', x: CX + 400, y: CY + 500 },
    { t: '邪修道人（道袍+桃木剑）', x: CX + 650, y: CY + 500 },
    { t: '赤月年兽（犄角+云纹）', x: CX + 950, y: CY + 500 },
    { t: '灵气珠', x: CX + 650, y: CY + 670 },
    { t: '铜钱', x: CX + 900, y: CY + 670 },
    { t: '子弹', x: CX + 150, y: CY + 670 },
    { t: '法术符咒', x: CX + 400, y: CY + 670 },
  ];

  function drawLabels() {
    var ctx = R.ctx;
    ctx.font = '600 15px system-ui, "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var i = 0; i < LABELS.length; i++) {
      var L = LABELS[i];
      var w = ctx.measureText(L.t).width + 16;
      ctx.fillStyle = 'rgba(30,22,14,0.66)';
      ctx.fillRect(L.x - w / 2, L.y - 12, w, 24);
      ctx.fillStyle = '#f4ecd6';
      ctx.fillText(L.t, L.x, L.y + 1);
    }
    // 标题水印
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(30,22,14,0.5)';
    ctx.font = '600 14px system-ui, sans-serif';
    ctx.fillText('赤月猎场 · 美术预览', CX + 1250, CY + 700);
  }

  /* ---------------- 循环 ---------------- */
  var last = 0;
  function loop(ts) {
    requestAnimationFrame(loop);
    if (!last) last = ts;
    var dt = (ts - last) / 1000;
    last = ts;
    if (dt > 0.05) dt = 0.05;
    if (dt <= 0) return;

    // 推进动画：行走循环、怪物待机、掉落物浮动
    playerWalk.walkTime += dt;
    for (var i = 0; i < enemies.length; i++) enemies[i].animTime += dt;
    for (var k = 0; k < pickups.length; k++) pickups[k].bob += dt * 4;

    R.render(state, dt);
    drawLabels();
  }
  requestAnimationFrame(loop);

  console.log('[Preview] 就绪：主角 3 态 + 4 种怪物 + 2 种投射物 + 2 种掉落物');
})();
</script>
</body>
</html>
