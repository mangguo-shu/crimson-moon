name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装依赖
        run: npm install

      - name: 拷贝 web 资源到 www
        run: npm run build:web

      - name: 添加并同步 Android 平台
        run: |
          npx cap add android
          npx cap sync android

      - name: 打安卓工程补丁（横屏/全屏/权限/版本/常亮）
        run: node scripts/patch-android.js

      - name: 生成 debug keystore（兜底）
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 构建 debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: 上传 APK 为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: crimson-moon-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: 手动触发时创建 Release 并附加 APK
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 赤月猎场 v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: true
